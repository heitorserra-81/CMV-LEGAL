<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CMV Legal | Heitor Serra Neto</title>
    <style>
        :root {
            --bg: #f0f4f7;
            --card-bg: #ffffff;
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --danger: #e74c3c;
            --text: #1e2b38;
            --text-light: #5d6d7e;
            --header-bg: linear-gradient(135deg, #0f1a24, #1e2b38);
            --border-radius: 20px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .dark-mode {
            --bg: #1a1f24;
            --card-bg: #2a2f36;
            --text: #e0e0e0;
            --text-light: #a0a8b0;
            --header-bg: linear-gradient(135deg, #0a0f14, #141b22);
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        .app { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }

        /* Header */
        .header {
            background: var(--header-bg);
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .logo-icon { font-size: 52px; animation: float 3s infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .logo-title {
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(34px, 8vw, 52px); font-weight: 900; letter-spacing: 3px;
            color: white; text-transform: uppercase;
        }
        .logo-title .cmv { background: linear-gradient(to right, #fff, #e0e0e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-title .legal { background: linear-gradient(135deg, #27ae60, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        .logo-subtitle { font-size: 14px; letter-spacing: 4px; color: rgba(255,255,255,0.85); text-transform: uppercase; }
        .logo-author { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; display: inline-block; }
        .dark-toggle {
            position: absolute; top: 15px; right: 20px; z-index: 2;
            background: rgba(255,255,255,0.15); border: none; color: white; font-size: 1.5rem;
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Main */
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow); }
        h2 { font-size: 1.2rem; margin: 0 0 15px; border-left: 4px solid var(--primary); padding-left: 12px; display: flex; align-items: center; gap: 8px; }
        .grid-vendas { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
        .input-group input { padding: 10px; border: 1px solid #dcdfe3; border-radius: 12px; font-size: 0.9rem; background: #f9fafb; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(39,174,96,0.3); display: inline-flex; align-items: center; gap: 8px; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
        .btn-ajuda { background: #3498db; border: none; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; position: fixed; bottom: 30px; left: 30px; z-index: 20; box-shadow: 0 6px 20px rgba(52,152,219,0.4); display: flex; align-items: center; justify-content: center; }

        /* Cards insumo */
        .estoque-cards { display: flex; flex-direction: column; gap: 16px; }
        .insumo-card {
            background: var(--card-bg); border-radius: 18px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border: 2px solid transparent; transition: all 0.3s; cursor: pointer;
        }
        .insumo-card.perda { border-color: #e74c3c; animation: glowRed 1.8s infinite; }
        .insumo-card.ok { border-color: #27ae60; animation: glowGreen 2s infinite; }
        @keyframes glowRed {
            0% { box-shadow: 0 0 8px rgba(231,76,60,0.3); }
            50% { box-shadow: 0 0 20px rgba(231,76,60,0.6); }
            100% { box-shadow: 0 0 8px rgba(231,76,60,0.3); }
        }
        @keyframes glowGreen {
            0% { box-shadow: 0 0 6px rgba(39,174,96,0.2); }
            50% { box-shadow: 0 0 18px rgba(39,174,96,0.5); }
            100% { box-shadow: 0 0 6px rgba(39,174,96,0.2); }
        }
        .progress-bar { height: 8px; background: #ecf0f1; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.5s; }
        .fab-calcular {
            position: fixed; bottom: 30px; right: 30px; z-index: 20;
            background: var(--primary); color: white; border: none; border-radius: 60px;
            padding: 16px 28px; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 10px 30px rgba(39,174,96,0.5); display: flex; align-items: center; gap: 8px;
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%,100% { box-shadow: 0 10px 30px rgba(39,174,96,0.5); } 50% { box-shadow: 0 15px 40px rgba(39,174,96,0.8); } }

        /* Modal Danilo */
        .modal-danilo-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; display: flex;
            align-items: center; justify-content: center;
        }
        .modal-danilo { background: white; border-radius: 20px; padding: 30px; text-align: center; max-width: 400px; }

        /* Celebração */
        .celebracao-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .maos-palmas { font-size: 80px; animation: subir 1.5s ease-out forwards; display: flex; gap: 30px; }
        @keyframes subir { 0% { transform: translateY(100vh) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        .texto-parabens { color: gold; font-size: 3rem; font-weight: 900; text-shadow: 0 0 20px gold; animation: brilho 0.8s infinite alternate; }
        @keyframes brilho { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        /* Modal Ajuda */
        .modal-ajuda-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 150; display: flex;
            align-items: center; justify-content: center;
        }
        .modal-ajuda {
            background: var(--card-bg); border-radius: 20px; padding: 25px;
            max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto;
        }
        .search-ajuda { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 30px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Header -->
    <header class="header">
        <button class="dark-toggle" id="darkToggle" title="Alternar tema">🌙</button>
        <div class="logo-icon">🍔📊</div>
        <div class="logo-title"><span class="cmv">CMV</span> <span class="legal">Legal</span></div>
        <div class="logo-subtitle">Controle de Estoques e Gastos</div>
        <div class="logo-author">Desenvolvido por Heitor Serra Neto</div>
    </header>

    <div class="main-content" id="mainContent">
        <!-- Dashboard resumo (aparece após cálculo) -->
        <div class="card" id="dashboardCard" style="display:none;">
            <h2>📊 Painel de Controle</h2>
            <div id="dashboardContent"></div>
        </div>

        <!-- Vendas -->
        <div class="card">
            <h2>📈 Vendas do Período</h2>
            <div class="abas" id="abas-vendas">
                <button class="aba-btn ativa" data-tab="lanches">Lanches</button>
                <button class="aba-btn" data-tab="refri">Refrigerantes</button>
                <button class="aba-btn" data-tab="sucos">Sucos Naturais</button>
            </div>
            <div><label>Simular aumento: <input type="range" id="simulador" min="0" max="50" value="0"> <span id="simValor">0%</span></label></div>
            <div id="vendas-lanches" class="grid-vendas tab-vendas"></div>
            <div id="vendas-refri" class="grid-vendas tab-vendas" style="display:none;"></div>
            <div id="vendas-sucos" class="grid-vendas tab-vendas" style="display:none;"></div>
        </div>

        <!-- Estoque -->
        <div class="card">
            <h2>📦 Estoque & Divergências</h2>
            <button class="btn-outline" id="exemplo-btn">📋 Dados de exemplo</button>
            <button class="btn-outline" id="exportar-btn" style="margin-left:10px;">📄 Exportar Relatório</button>
            <div id="estoque-cards-container" class="estoque-cards"></div>
            <button class="btn" id="calcular-btn">🔍 Calcular Divergências</button>
        </div>
    </div>

    <!-- FAB Calcular -->
    <button class="fab-calcular" id="fabCalcular">🔍 Calcular</button>
    <!-- Botão Ajuda -->
    <button class="btn-ajuda" id="btnAjuda">?</button>
</div>

<!-- Modal Danilo -->
<div class="modal-danilo-overlay" id="modalDanilo">
    <div class="modal-danilo">
        <h2>💡 Ideia do Danilo</h2>
        <p>Este aplicativo foi criado com a ideia do <strong>Danilo</strong>, amigo do Heitor.</p>
        <button class="btn" id="btnOkDanilo">OK, vamos lá!</button>
    </div>
</div>

<!-- Modal Detalhes Insumo (oculto) -->
<div class="modal-detalhes" id="modalDetalhes" style="display:none;">
    <div class="modal-conteudo" id="modalDetalhesConteudo"></div>
</div>

<!-- Modal Ajuda (oculto) -->
<div class="modal-ajuda-overlay" id="modalAjuda" style="display:none;">
    <div class="modal-ajuda" id="modalAjudaConteudo"></div>
</div>

<script>
// ======================= DADOS =======================
function normalizaInsumo(str) { return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase(); }

const lanches = [
    { nome: 'X-Bacon', receita: { carne:150, bacon:50, queijo:30, pao:70 } },
    { nome: 'X-Salada', receita: { carne:120, queijo:20, alface:15, tomate:20, pao:70 } },
    { nome: 'X-Tudo', receita: { carne:150, bacon:40, ovo:1, presunto:30, queijo:30, alface:15, tomate:20, milho:20, batataPalha:20, pao:70 } },
    { nome: 'X-Egg', receita: { carne:150, ovo:1, queijo:30, pao:70 } },
    { nome: 'X-Frango', receita: { frango:150, queijo:30, alface:15, tomate:20, pao:70 } },
    { nome: 'X-Burger', receita: { carne:150, queijo:30, pao:70 } },
    { nome: 'X-Calabresa', receita: { carne:120, calabresa:50, queijo:30, pao:70 } },
    { nome: 'X-Coração', receita: { carne:120, coracao:60, queijo:30, pao:70 } },
    { nome: 'Misto Quente', receita: { presunto:50, queijo:50, pao:60 } },
    { nome: 'Veggie Burger', receita: { hamburguerGraoDeBico:130, alface:20, tomate:20, cebola:15, pao:70 } }
];

const refris = ['Coca-Cola','Guaraná Antarctica','Sprite','Fanta Uva','Fanta Laranja','Pepsi','Soda Limonada','Água Tônica','Schweppes Citrus','H2OH']
    .map(nome => ({ nome, receita: { [normalizaInsumo(nome)]: 1 } }));

const sucos = [
    { nome: 'Suco de Laranja', receita: { laranja:3, acucar:20 } },
    { nome: 'Limonada', receita: { limao:2, acucar:20 } },
    { nome: 'Suco de Abacaxi', receita: { abacaxi:150, acucar:15 } },
    { nome: 'Suco de Maracujá', receita: { maracuja:2, acucar:20 } },
    { nome: 'Suco de Acerola', receita: { acerola:100, acucar:20 } },
    { nome: 'Suco de Melancia', receita: { melancia:200, acucar:10 } },
    { nome: 'Suco de Morango', receita: { morango:120, acucar:20 } },
    { nome: 'Suco de Manga', receita: { manga:150, acucar:15 } },
    { nome: 'Suco de Goiaba', receita: { goiaba:100, acucar:20 } },
    { nome: 'Suco de Caju', receita: { caju:80, acucar:20 } }
];

const insumos = {
    carne: { nome: 'Carne Bovina', unid: 'g', custoKg: 30, estoqueMin: 2000 },
    bacon: { nome: 'Bacon', unid: 'g', custoKg: 40, estoqueMin: 800 },
    queijo: { nome: 'Queijo', unid: 'g', custoKg: 35, estoqueMin: 1500 },
    pao: { nome: 'Pão de Hambúrguer', unid: 'g', custoKg: 12, estoqueMin: 2000 },
    ovo: { nome: 'Ovo', unid: 'un', custoUnit: 0.80, estoqueMin: 60 },
    presunto: { nome: 'Presunto', unid: 'g', custoKg: 28, estoqueMin: 500 },
    alface: { nome: 'Alface', unid: 'g', custoKg: 8, estoqueMin: 300 },
    tomate: { nome: 'Tomate', unid: 'g', custoKg: 10, estoqueMin: 400 },
    cebola: { nome: 'Cebola', unid: 'g', custoKg: 6, estoqueMin: 200 },
    milho: { nome: 'Milho', unid: 'g', custoKg: 7, estoqueMin: 200 },
    batataPalha: { nome: 'Batata Palha', unid: 'g', custoKg: 15, estoqueMin: 200 },
    calabresa: { nome: 'Calabresa', unid: 'g', custoKg: 22, estoqueMin: 300 },
    coracao: { nome: 'Coração de Frango', unid: 'g', custoKg: 18, estoqueMin: 300 },
    frango: { nome: 'Filé de Frango', unid: 'g', custoKg: 20, estoqueMin: 500 },
    hamburguerGraoDeBico: { nome: 'Hambúrguer Grão-de-Bico', unid: 'g', custoKg: 16, estoqueMin: 300 },
    laranja: { nome: 'Laranja', unid: 'un', custoUnit: 0.50, estoqueMin: 80 },
    limao: { nome: 'Limão', unid: 'un', custoUnit: 0.30, estoqueMin: 60 },
    abacaxi: { nome: 'Abacaxi', unid: 'g', custoKg: 7, estoqueMin: 2000 },
    maracuja: { nome: 'Maracujá', unid: 'un', custoUnit: 0.80, estoqueMin: 30 },
    acerola: { nome: 'Acerola', unid: 'g', custoKg: 12, estoqueMin: 500 },
    melancia: { nome: 'Melancia', unid: 'g', custoKg: 4, estoqueMin: 3000 },
    morango: { nome: 'Morango', unid: 'g', custoKg: 18, estoqueMin: 500 },
    manga: { nome: 'Manga', unid: 'g', custoKg: 8, estoqueMin: 1000 },
    goiaba: { nome: 'Goiaba', unid: 'g', custoKg: 6, estoqueMin: 500 },
    caju: { nome: 'Caju', unid: 'g', custoKg: 9, estoqueMin: 400 },
    acucar: { nome: 'Açúcar', unid: 'g', custoKg: 4, estoqueMin: 1000 }
};
refris.forEach(r => { const chave = normalizaInsumo(r.nome); insumos[chave] = { nome: r.nome + ' (lata)', unid: 'un', custoUnit: 2.50, estoqueMin: 40 }; });

// Histórico (localStorage)
let historico = JSON.parse(localStorage.getItem('cmvHistorico') || '[]');

// ======================= MONTAGEM DA INTERFACE =======================
function criarCamposVenda(container, lista) {
    container.innerHTML = lista.map(p =>
        `<div class="input-group"><label>${p.nome}</label><input type="number" id="venda_${normalizaInsumo(p.nome)}" min="0" step="1" value="0"></div>`
    ).join('');
}
criarCamposVenda(document.getElementById('vendas-lanches'), lanches);
criarCamposVenda(document.getElementById('vendas-refri'), refris);
criarCamposVenda(document.getElementById('vendas-sucos'), sucos);

const containerCards = document.getElementById('estoque-cards-container');
function montarCardsEstoque() {
    containerCards.innerHTML = Object.entries(insumos).map(([chave, ins]) => {
        const custo = ins.custoKg ? (ins.custoKg / 1000).toFixed(4) : ins.custoUnit.toFixed(2);
        return `<div class="insumo-card neutro" id="card_${chave}" onclick="abrirDetalhes('${chave}')">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:700;">📦 ${ins.nome} (${ins.unid})</span>
                <span id="status_badge_${chave}" style="font-size:0.8rem;padding:4px 12px;border-radius:20px;">-</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress_${chave}" style="width:0%;background:#27ae60;"></div></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:10px;">
                <div class="input-group"><label>Estoque Inicial</label><input type="number" id="ini_${chave}" step="any" value="0"></div>
                <div class="input-group"><label>Compras</label><input type="number" id="compra_${chave}" step="any" value="0"></div>
                <div class="input-group"><label>Estoque Final Real</label><input type="number" id="final_${chave}" step="any" value="0"></div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;background:#f8faf9;padding:12px;border-radius:12px;margin-top:10px;">
                <div><span style="font-size:0.7rem;color:#5d6d7e;">Consumo Teórico</span><br><span id="cons_${chave}">-</span></div>
                <div><span style="font-size:0.7rem;color:#5d6d7e;">Estoque Teórico</span><br><span id="teorico_${chave}">-</span></div>
                <div><span style="font-size:0.7rem;color:#5d6d7e;">Divergência Qtd</span><br><span id="div_${chave}">-</span></div>
                <div><span style="font-size:0.7rem;color:#5d6d7e;">Divergência R$</span><br><span id="divR_${chave}">-</span></div>
                <div><span style="font-size:0.7rem;color:#5d6d7e;">Mínimo</span><br><span>${ins.estoqueMin}</span></div>
            </div>
            <div id="sugestao_${chave}" style="display:none;font-size:0.8rem;background:#fef9e7;padding:6px 10px;border-radius:8px;margin-top:8px;"></div>
        </div>`;
    }).join('');
}
montarCardsEstoque();

// ======================= FUNCIONALIDADES =======================
let ultimoConsumo = {};
function calcular(salvarHistorico = true) {
    const consumo = {}; Object.keys(insumos).forEach(k => consumo[k] = 0);
    const simPct = parseInt(document.getElementById('simulador').value) / 100;
    [lanches, refris, sucos].forEach(lista => {
        lista.forEach(p => {
            let qtd = parseFloat(document.getElementById('venda_' + normalizaInsumo(p.nome))?.value) || 0;
            qtd *= (1 + simPct);
            if (qtd > 0) Object.entries(p.receita).forEach(([k, v]) => { if (consumo[k] !== undefined) consumo[k] += v * qtd; });
        });
    });
    ultimoConsumo = consumo;

    let maiorPerdaR = -Infinity, insumoCritico = '', totais = { perdaTotal: 0, ganhoTotal: 0 };
    Object.entries(insumos).forEach(([chave, ins]) => {
        const ini = parseFloat(document.getElementById(`ini_${chave}`)?.value) || 0;
        const compra = parseFloat(document.getElementById(`compra_${chave}`)?.value) || 0;
        const finalReal = parseFloat(document.getElementById(`final_${chave}`)?.value) || 0;
        const consTeo = consumo[chave] || 0;
        const estoqueTeo = ini + compra - consTeo;
        const divQtd = estoqueTeo - finalReal;
        const custoUnit = ins.custoKg ? ins.custoKg / 1000 : ins.custoUnit;
        const divR = divQtd * custoUnit;

        document.getElementById(`cons_${chave}`).textContent = consTeo.toFixed(2);
        document.getElementById(`teorico_${chave}`).textContent = estoqueTeo.toFixed(2);
        document.getElementById(`div_${chave}`).textContent = divQtd.toFixed(2);
        document.getElementById(`divR_${chave}`).textContent = 'R$ ' + divR.toFixed(2);

        const card = document.getElementById(`card_${chave}`);
        const badge = document.getElementById(`status_badge_${chave}`);
        const sug = document.getElementById(`sugestao_${chave}`);
        const progress = document.getElementById(`progress_${chave}`);
        card.classList.remove('perda', 'ok', 'neutro');

        const pctMinimo = Math.min(100, (finalReal / ins.estoqueMin) * 100);
        progress.style.width = pctMinimo + '%';
        progress.style.background = pctMinimo < 30 ? '#e74c3c' : pctMinimo < 70 ? '#f39c12' : '#27ae60';

        if (finalReal < ins.estoqueMin) {
            badge.className = 'status-baixo-badge'; badge.textContent = '🔴 Abaixo';
            badge.style.background = '#fdecea'; badge.style.color = '#e74c3c';
            const necessidade = ins.estoqueMin - finalReal;
            const custoNecessidade = necessidade * custoUnit;
            sug.style.display = 'block';
            sug.textContent = `💡 Comprar ${necessidade.toFixed(2)} ${ins.unid} (≈ R$ ${custoNecessidade.toFixed(2)})`;
        } else {
            badge.className = 'status-ok-badge'; badge.textContent = '🟢 OK';
            badge.style.background = '#eafaf1'; badge.style.color = '#27ae60';
            sug.style.display = 'none';
        }

        if (divQtd > 0.001) {
            card.classList.add('perda');
            totais.perdaTotal += divR;
            if (divR > maiorPerdaR) { maiorPerdaR = divR; insumoCritico = ins.nome; }
        } else if (divQtd < -0.001) {
            card.classList.add('ok');
            totais.ganhoTotal += Math.abs(divR);
        } else card.classList.add('neutro');
    });

    document.getElementById('dashboardCard').style.display = 'block';
    document.getElementById('dashboardContent').innerHTML = `
        <p>🔴 <strong>Ponto Crítico:</strong> ${insumoCritico} (R$ ${maiorPerdaR.toFixed(2)})</p>
        <p>📉 Perda total: R$ ${totais.perdaTotal.toFixed(2)} | 📈 Ganho total: R$ ${totais.ganhoTotal.toFixed(2)}</p>
    `;

    if (salvarHistorico) {
        historico.push({ data: new Date().toLocaleString(), consumo, totais, insumoCritico });
        if (historico.length > 10) historico.shift();
        localStorage.setItem('cmvHistorico', JSON.stringify(historico));
    }
}

// Detalhes do insumo (modal)
window.abrirDetalhes = function(chave) {
    const ins = insumos[chave];
    const hist = historico.filter(h => h.consumo[chave]).slice(-5);
    document.getElementById('modalDetalhes').style.display = 'flex';
    document.getElementById('modalDetalhesConteudo').innerHTML = `
        <h3>${ins.nome}</h3>
        <p><strong>Últimos consumos:</strong> ${hist.length ? hist.map(h => h.consumo[chave].toFixed(2) + 'g em ' + h.data).join('<br>') : 'Sem histórico'}</p>
        <canvas id="grafico_${chave}" width="300" height="150"></canvas>
        <button class="btn" onclick="document.getElementById('modalDetalhes').style.display='none'">Fechar</button>
    `;
    // Gráfico simples
    const canvas = document.getElementById('grafico_' + chave);
    if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 300, 150);
        ctx.fillStyle = '#27ae60';
        const consumoAtual = ultimoConsumo[chave] || 0;
        ctx.fillRect(50, 130 - consumoAtual / 10, 50, consumoAtual / 10);
        ctx.fillStyle = '#e74c3c';
        const finalReal = parseFloat(document.getElementById(`final_${chave}`)?.value) || 0;
        ctx.fillRect(150, 130 - finalReal / 10, 50, finalReal / 10);
    }
};

window.filtrarAjuda = function() {
    const termo = document.getElementById('searchAjuda').value.toLowerCase();
    const conteudo = document.getElementById('ajudaConteudo');
    const h3s = conteudo.querySelectorAll('h3');
    h3s.forEach(h3 => {
        const p = h3.nextElementSibling;
        if (h3.textContent.toLowerCase().includes(termo) || (p && p.textContent.toLowerCase().includes(termo))) {
            h3.style.display = 'block'; if (p) p.style.display = 'block';
        } else {
            h3.style.display = 'none'; if (p) p.style.display = 'none';
        }
    });
};

// ======================= SURPRESA DANILO =======================
function tocarPalmas() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.08);
            }, i * 120);
        }
    } catch(e) {}
}

function tocarPlateia() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600 + Math.random() * 400, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            }, i * 80);
        }
    } catch(e) {}
}

function falar(texto) {
    return new Promise(resolve => {
        if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR'; utter.rate = 0.9;
            utter.onend = resolve;
            window.speechSynthesis.speak(utter);
        } else resolve();
    });
}

document.getElementById('btnOkDanilo').addEventListener('click', async () => {
    document.getElementById('modalDanilo').style.display = 'none';
    tocarPalmas();
    const celebracao = document.createElement('div');
    celebracao.className = 'celebracao-overlay';
    celebracao.innerHTML = `<div class="maos-palmas"><span>👏</span><span>👏</span></div><div class="texto-parabens">Parabéns, Danilo!</div>`;
    document.body.appendChild(celebracao);

    await falar('Parabéns, Danilo. Uhul!');
    for (let i = 0; i < 3; i++) await falar('Parabéns, Danilo. Você é o melhor.');

    tocarPlateia();
    await falar('A plateia vibra por você, Danilo!');

    setTimeout(() => celebracao.remove(), 2000);
});
