<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CMV Legal | Heitor Serra Neto</title>
    <style>
        :root {
            --bg: #f0f4f7;
            --card-bg: #ffffff;
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --danger: #e74c3c;
            --text: #1e2b38;
            --text-light: #5d6d7e;
            --header-bg: linear-gradient(135deg, #0f1a24, #1e2b38);
            --border-radius: 20px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --input-bg: #f4f6f8;
        }
        .dark-mode {
            --bg: #1a1f24;
            --card-bg: #2a2f36;
            --text: #e0e0e0;
            --text-light: #a0a8b0;
            --header-bg: linear-gradient(135deg, #0a0f14, #141b22);
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
            --input-bg: #3a3f46;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; width: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
        }

        /* Header */
        .header {
            background: var(--header-bg);
            padding: clamp(12px, 3vw, 20px);
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .logo-icon { font-size: clamp(36px, 8vw, 52px); animation: float 3s infinite; display: inline-block; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .logo-title {
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(28px, 7vw, 48px);
            font-weight: 900; letter-spacing: 2px;
            color: white; text-transform: uppercase; line-height: 1.1;
        }
        .logo-title .cmv { background: linear-gradient(to right, #fff, #e0e0e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo-title .legal { background: linear-gradient(135deg, #27ae60, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        .logo-subtitle { font-size: clamp(10px, 2.5vw, 14px); letter-spacing: 3px; color: rgba(255,255,255,0.85); text-transform: uppercase; }
        .logo-author { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px; display: inline-block; }
        .dark-toggle {
            position: absolute; top: 12px; right: 16px; z-index: 2;
            background: rgba(255,255,255,0.15); border: none; color: white; font-size: 1.3rem;
            border-radius: 50%; width: 38px; height: 38px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Main */
        .main-content {
            flex: 1; padding: clamp(12px, 3vw, 20px);
            display: flex; flex-direction: column; gap: clamp(12px, 2vw, 20px);
            overflow-y: auto; width: 100%; max-width: 100%;
        }
        .card {
            background: var(--card-bg); border-radius: var(--border-radius);
            padding: clamp(14px, 3vw, 20px); box-shadow: var(--shadow);
            width: 100%; max-width: 100%;
        }
        h2 {
            font-size: clamp(1rem, 3vw, 1.2rem); margin: 0 0 12px;
            border-left: 4px solid var(--primary); padding-left: 10px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .grid-vendas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.75rem; font-weight: 600; margin-bottom: 3px; }
        .input-group input {
            padding: 10px 12px; border: 1px solid #dcdfe3; border-radius: 12px;
            font-size: 0.9rem; background: var(--input-bg); color: var(--text);
            transition: 0.2s; width: 100%;
        }
        .input-group input:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(39,174,96,0.15);
            outline: none;
        }
        .input-group input::placeholder {
            color: #999; font-style: italic; opacity: 0.7;
        }

        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .btn {
            background: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: 30px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 15px rgba(39,174,96,0.3);
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.9rem; transition: 0.2s; white-space: nowrap;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
        .btn-outline:hover { background: var(--primary); color: white; }
        .btn-azul { background: #3498db; box-shadow: 0 4px 15px rgba(52,152,219,0.4); }
        .btn-azul:hover { background: #2980b9; }
        .btn-export { background: #f39c12; box-shadow: 0 4px 15px rgba(243,156,18,0.4); }
        .btn-export:hover { background: #e67e22; }

        .estoque-cards { display: flex; flex-direction: column; gap: 14px; }
        .insumo-card {
            background: var(--card-bg); border-radius: 18px; padding: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border: 2px solid transparent; transition: all 0.3s; cursor: pointer;
            width: 100%; max-width: 100%;
        }
        .insumo-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        .insumo-card.perda { border-color: #e74c3c; animation: glowRed 1.8s infinite; }
        .insumo-card.ok { border-color: #27ae60; animation: glowGreen 2s infinite; }
        @keyframes glowRed {
            0% { box-shadow: 0 0 8px rgba(231,76,60,0.3), 0 6px 18px rgba(0,0,0,0.05); }
            50% { box-shadow: 0 0 22px rgba(231,76,60,0.65), 0 6px 18px rgba(0,0,0,0.1); }
            100% { box-shadow: 0 0 8px rgba(231,76,60,0.3), 0 6px 18px rgba(0,0,0,0.05); }
        }
        @keyframes glowGreen {
            0% { box-shadow: 0 0 6px rgba(39,174,96,0.2), 0 6px 18px rgba(0,0,0,0.05); }
            50% { box-shadow: 0 0 20px rgba(39,174,96,0.55), 0 6px 18px rgba(0,0,0,0.1); }
            100% { box-shadow: 0 0 6px rgba(39,174,96,0.2), 0 6px 18px rgba(0,0,0,0.05); }
        }
        .insumo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .insumo-nome { font-weight: 700; font-size: 0.95rem; }
        .insumo-status { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .progress-bar { height: 6px; background: #ecf0f1; border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.5s; }
        .insumo-dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin: 8px 0; }
        .insumo-resultados { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; background: #f8faf9; padding: 10px; border-radius: 12px; font-size: 0.8rem; }
        .result-item { display: flex; flex-direction: column; }
        .result-label { font-size: 0.65rem; color: var(--text-light); text-transform: uppercase; }
        .result-value { font-weight: 700; }
        .sugestao-text { font-size: 0.8rem; font-style: italic; background: #fef9e7; padding: 6px 10px; border-radius: 8px; margin-top: 8px; }

        .fab-calcular {
            position: fixed; bottom: 25px; right: 25px; z-index: 20;
            background: var(--primary); color: white; border: none; border-radius: 60px;
            padding: 14px 24px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 10px 30px rgba(39,174,96,0.5); display: flex; align-items: center; gap: 8px;
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%,100% { box-shadow: 0 10px 30px rgba(39,174,96,0.5); } 50% { box-shadow: 0 18px 40px rgba(39,174,96,0.8); } }
        .btn-ajuda-flutuante {
            position: fixed; bottom: 25px; left: 25px; z-index: 20;
            background: #3498db; color: white; border: none; border-radius: 50%;
            width: 50px; height: 50px; font-size: 1.4rem; cursor: pointer;
            box-shadow: 0 8px 25px rgba(52,152,219,0.5); display: flex; align-items: center; justify-content: center;
        }

        /* Modal overlay genérico */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: var(--card-bg); border-radius: 20px; padding: clamp(16px, 4vw, 24px);
            width: 100%; max-width: 650px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .modal-box h3 { margin-bottom: 10px; font-size: 1.1rem; }
        .modal-box canvas { width: 100%; max-width: 400px; height: auto; margin: 10px 0; }

        .search-input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 30px; margin-bottom: 15px; font-size: 0.9rem; }

        .abas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .aba-btn { background: #ecf0f1; border: none; padding: 8px 16px; border-radius: 25px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .aba-btn.ativa { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(39,174,96,0.4); }

        /* Celebração */
        .celebracao-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .maos-palmas { font-size: 80px; animation: subir 1.5s ease-out forwards; display: flex; gap: 30px; }
        @keyframes subir { 0% { transform: translateY(100vh) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        .texto-parabens { color: gold; font-size: clamp(2rem, 8vw, 3rem); font-weight: 900; text-shadow: 0 0 20px gold; animation: brilho 0.8s infinite alternate; }
        @keyframes brilho { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        @media (max-width: 480px) {
            .grid-vendas { grid-template-columns: 1fr 1fr; }
            .insumo-dados { grid-template-columns: 1fr 1fr; }
            .insumo-resultados { grid-template-columns: 1fr 1fr; }
            .fab-calcular { padding: 12px 18px; font-size: 0.85rem; bottom: 15px; right: 15px; }
            .btn-ajuda-flutuante { width: 42px; height: 42px; font-size: 1.2rem; bottom: 15px; left: 15px; }
        }
        @media (min-width: 1200px) {
            .main-content { max-width: 1200px; margin: 0 auto; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Header -->
    <header class="header">
        <button class="dark-toggle" id="darkToggle" title="Alternar tema">🌙</button>
        <div class="logo-icon">🍔📊</div>
        <div class="logo-title"><span class="cmv">CMV</span> <span class="legal">Legal</span></div>
        <div class="logo-subtitle">Controle de Estoques e Gastos</div>
        <div class="logo-author">Desenvolvido por Heitor Serra Neto</div>
    </header>

    <div class="main-content" id="mainContent">
        <!-- Dashboard -->
        <div class="card" id="dashboardCard" style="display:none;">
            <h2>📊 Painel de Controle</h2>
            <div id="dashboardContent"></div>
        </div>

        <!-- Vendas -->
        <div class="card">
            <h2>📈 Vendas do Período</h2>
            <div class="abas" id="abas-vendas">
                <button class="aba-btn ativa" data-tab="lanches">🍔 Lanches</button>
                <button class="aba-btn" data-tab="refri">🥤 Refrigerantes</button>
                <button class="aba-btn" data-tab="sucos">🧃 Sucos Naturais</button>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
                <label style="font-size:0.8rem;font-weight:600;">🔮 Simular aumento:</label>
                <input type="range" id="simulador" min="0" max="50" value="0" style="flex:1;max-width:200px;">
                <span id="simValor" style="font-weight:700;">0%</span>
            </div>
            <div id="vendas-lanches" class="grid-vendas tab-vendas"></div>
            <div id="vendas-refri" class="grid-vendas tab-vendas" style="display:none;"></div>
            <div id="vendas-sucos" class="grid-vendas tab-vendas" style="display:none;"></div>
        </div>

        <!-- Estoque -->
        <div class="card">
            <h2>📦 Estoque & Divergências</h2>
            <div class="btn-row">
                <button class="btn-outline" id="exemplo-btn">📋 Exemplo</button>
                <button class="btn btn-export" id="exportar-btn">📄 Exportar</button>
            </div>
            <div id="estoque-cards-container" class="estoque-cards"></div>
            <button class="btn" id="calcular-btn" style="margin-top:12px;">🔍 Calcular Divergências</button>
        </div>
    </div>

    <button class="fab-calcular" id="fabCalcular">🔍 Calcular</button>
    <button class="btn-ajuda-flutuante" id="btnAjuda">?</button>
</div>

<!-- Modal Danilo -->
<div class="modal-overlay" id="modalDanilo">
    <div class="modal-box" style="text-align:center;max-width:400px;">
        <h2>💡 Ideia do Danilo</h2>
        <p>Este aplicativo foi criado com a ideia do <strong>Danilo</strong>, amigo do Heitor.</p>
        <p style="font-size:0.85rem;color:#5d6d7e;">Teste o aplicativo e aproveite!</p>
        <button class="btn" id="btnOkDanilo" style="margin-top:15px;">OK, vamos lá!</button>
    </div>
</div>

<!-- Modal Detalhes Insumo -->
<div class="modal-overlay" id="modalDetalhes" style="display:none;">
    <div class="modal-box" id="modalDetalhesConteudo"></div>
</div>

<!-- Modal Ajuda -->
<div class="modal-overlay" id="modalAjuda" style="display:none;">
    <div class="modal-box" id="modalAjudaConteudo"></div>
</div>

<script>
// ======================= DADOS =======================
function normalizaInsumo(str) { return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase(); }

const lanches = [
    { nome: 'X-Bacon', receita: { carne:150, bacon:50, queijo:30, pao:70 } },
    { nome: 'X-Salada', receita: { carne:120, queijo:20, alface:15, tomate:20, pao:70 } },
    { nome: 'X-Tudo', receita: { carne:150, bacon:40, ovo:1, presunto:30, queijo:30, alface:15, tomate:20, milho:20, batataPalha:20, pao:70 } },
    { nome: 'X-Egg', receita: { carne:150, ovo:1, queijo:30, pao:70 } },
    { nome: 'X-Frango', receita: { frango:150, queijo:30, alface:15, tomate:20, pao:70 } },
    { nome: 'X-Burger', receita: { carne:150, queijo:30, pao:70 } },
    { nome: 'X-Calabresa', receita: { carne:120, calabresa:50, queijo:30, pao:70 } },
    { nome: 'X-Coração', receita: { carne:120, coracao:60, queijo:30, pao:70 } },
    { nome: 'Misto Quente', receita: { presunto:50, queijo:50, pao:60 } },
    { nome: 'Veggie Burger', receita: { hamburguerGraoDeBico:130, alface:20, tomate:20, cebola:15, pao:70 } }
];

const refris = ['Coca-Cola','Guaraná Antarctica','Sprite','Fanta Uva','Fanta Laranja','Pepsi','Soda Limonada','Água Tônica','Schweppes Citrus','H2OH']
    .map(nome => ({ nome, receita: { [normalizaInsumo(nome)]: 1 } }));

const sucos = [
    { nome: 'Suco de Laranja', receita: { laranja:3, acucar:20 } },
    { nome: 'Limonada', receita: { limao:2, acucar:20 } },
    { nome: 'Suco de Abacaxi', receita: { abacaxi:150, acucar:15 } },
    { nome: 'Suco de Maracujá', receita: { maracuja:2, acucar:20 } },
    { nome: 'Suco de Acerola', receita: { acerola:100, acucar:20 } },
    { nome: 'Suco de Melancia', receita: { melancia:200, acucar:10 } },
    { nome: 'Suco de Morango', receita: { morango:120, acucar:20 } },
    { nome: 'Suco de Manga', receita: { manga:150, acucar:15 } },
    { nome: 'Suco de Goiaba', receita: { goiaba:100, acucar:20 } },
    { nome: 'Suco de Caju', receita: { caju:80, acucar:20 } }
];

const insumos = {
    carne: { nome: 'Carne Bovina', unid: 'g', custoKg: 30, estoqueMin: 2000 },
    bacon: { nome: 'Bacon', unid: 'g', custoKg: 40, estoqueMin: 800 },
    queijo: { nome: 'Queijo', unid: 'g', custoKg: 35, estoqueMin: 1500 },
    pao: { nome: 'Pão de Hambúrguer', unid: 'g', custoKg: 12, estoqueMin: 2000 },
    ovo: { nome: 'Ovo', unid: 'un', custoUnit: 0.80, estoqueMin: 60 },
    presunto: { nome: 'Presunto', unid: 'g', custoKg: 28, estoqueMin: 500 },
    alface: { nome: 'Alface', unid: 'g', custoKg: 8, estoqueMin: 300 },
    tomate: { nome: 'Tomate', unid: 'g', custoKg: 10, estoqueMin: 400 },
    cebola: { nome: 'Cebola', unid: 'g', custoKg: 6, estoqueMin: 200 },
    milho: { nome: 'Milho', unid: 'g', custoKg: 7, estoqueMin: 200 },
    batataPalha: { nome: 'Batata Palha', unid: 'g', custoKg: 15, estoqueMin: 200 },
    calabresa: { nome: 'Calabresa', unid: 'g', custoKg: 22, estoqueMin: 300 },
    coracao: { nome: 'Coração de Frango', unid: 'g', custoKg: 18, estoqueMin: 300 },
    frango: { nome: 'Filé de Frango', unid: 'g', custoKg: 20, estoqueMin: 500 },
    hamburguerGraoDeBico: { nome: 'Hambúrguer Grão-de-Bico', unid: 'g', custoKg: 16, estoqueMin: 300 },
    laranja: { nome: 'Laranja', unid: 'un', custoUnit: 0.50, estoqueMin: 80 },
    limao: { nome: 'Limão', unid: 'un', custoUnit: 0.30, estoqueMin: 60 },
    abacaxi: { nome: 'Abacaxi', unid: 'g', custoKg: 7, estoqueMin: 2000 },
    maracuja: { nome: 'Maracujá', unid: 'un', custoUnit: 0.80, estoqueMin: 30 },
    acerola: { nome: 'Acerola', unid: 'g', custoKg: 12, estoqueMin: 500 },
    melancia: { nome: 'Melancia', unid: 'g', custoKg: 4, estoqueMin: 3000 },
    morango: { nome: 'Morango', unid: 'g', custoKg: 18, estoqueMin: 500 },
    manga: { nome: 'Manga', unid: 'g', custoKg: 8, estoqueMin: 1000 },
    goiaba: { nome: 'Goiaba', unid: 'g', custoKg: 6, estoqueMin: 500 },
    caju: { nome: 'Caju', unid: 'g', custoKg: 9, estoqueMin: 400 },
    acucar: { nome: 'Açúcar', unid: 'g', custoKg: 4, estoqueMin: 1000 }
};
refris.forEach(r => { const chave = normalizaInsumo(r.nome); insumos[chave] = { nome: r.nome + ' (lata)', unid: 'un', custoUnit: 2.50, estoqueMin: 40 }; });

// Histórico
let historico = JSON.parse(localStorage.getItem('cmvHistorico') || '[]');

// ======================= MONTAGEM DA INTERFACE =======================
function criarCamposVenda(container, lista) {
    container.innerHTML = lista.map(p =>
        `<div class="input-group">
            <label>${p.nome}</label>
            <input type="number" id="venda_${normalizaInsumo(p.nome)}" min="0" step="1" placeholder="Qtd">
        </div>`
    ).join('');
}
criarCamposVenda(document.getElementById('vendas-lanches'), lanches);
criarCamposVenda(document.getElementById('vendas-refri'), refris);
criarCamposVenda(document.getElementById('vendas-sucos'), sucos);

const containerCards = document.getElementById('estoque-cards-container');
function montarCardsEstoque() {
    containerCards.innerHTML = Object.entries(insumos).map(([chave, ins]) => {
        return `<div class="insumo-card neutro" id="card_${chave}" onclick="abrirDetalhes('${chave}')">
            <div class="insumo-header">
                <span class="insumo-nome">📦 ${ins.nome} <small style="color:var(--text-light);">(${ins.unid})</small></span>
                <span class="insumo-status" id="status_badge_${chave}" style="background:#ecf0f1;color:#5d6d7e;">-</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress_${chave}" style="width:0%;background:#27ae60;"></div></div>
            <div class="insumo-dados">
                <div class="input-group"><label>Estoque Inicial</label><input type="number" id="ini_${chave}" step="any" placeholder="0"></div>
                <div class="input-group"><label>Compras</label><input type="number" id="compra_${chave}" step="any" placeholder="0"></div>
                <div class="input-group"><label>Estoque Final Real</label><input type="number" id="final_${chave}" step="any" placeholder="0"></div>
            </div>
            <div class="insumo-resultados">
                <div class="result-item"><span class="result-label">Consumo Teórico</span><span class="result-value" id="cons_${chave}">-</span></div>
                <div class="result-item"><span class="result-label">Estoque Teórico</span><span class="result-value" id="teorico_${chave}">-</span></div>
                <div class="result-item"><span class="result-label">Divergência Qtd</span><span class="result-value" id="div_${chave}">-</span></div>
                <div class="result-item"><span class="result-label">Divergência R$</span><span class="result-value" id="divR_${chave}">-</span></div>

            </div>
            <div class="sugestao-text" id="sugestao_${chave}" style="display:none;"></div>
        </div>`;
    }).join('');
}

// ======================= CÁLCULO =======================
let ultimoConsumo = {};
function calcular(salvarHistorico = true) {
    const consumo = {}; Object.keys(insumos).forEach(k => consumo[k] = 0);
    const simPct = parseInt(document.getElementById('simulador').value) / 100;
    [lanches, refris, sucos].forEach(lista => {
        lista.forEach(p => {
            let qtd = parseFloat(document.getElementById('venda_' + normalizaInsumo(p.nome))?.value) || 0;
            qtd *= (1 + simPct);
            if (qtd > 0) Object.entries(p.receita).forEach(([k, v]) => { if (consumo[k] !== undefined) consumo[k] += v * qtd; });
        });
    });
    ultimoConsumo = consumo;

    let maiorPerdaR = -Infinity, insumoCritico = '', totais = { perdaTotal: 0, ganhoTotal: 0 };
    Object.entries(insumos).forEach(([chave, ins]) => {
        const ini = parseFloat(document.getElementById(`ini_${chave}`)?.value) || 0;
        const compra = parseFloat(document.getElementById(`compra_${chave}`)?.value) || 0;
        const finalReal = parseFloat(document.getElementById(`final_${chave}`)?.value) || 0;
        const consTeo = consumo[chave] || 0;
        const estoqueTeo = ini + compra - consTeo;
        const divQtd = estoqueTeo - finalReal;
        const custoUnit = ins.custoKg ? ins.custoKg / 1000 : ins.custoUnit;
        const divR = divQtd * custoUnit;

        document.getElementById(`cons_${chave}`).textContent = consTeo.toFixed(2);
        document.getElementById(`teorico_${chave}`).textContent = estoqueTeo.toFixed(2);
        document.getElementById(`div_${chave}`).textContent = divQtd.toFixed(2);
        document.getElementById(`divR_${chave}`).textContent = 'R$ ' + divR.toFixed(2);

        const card = document.getElementById(`card_${chave}`);
        const badge = document.getElementById(`status_badge_${chave}`);
        const sug = document.getElementById(`sugestao_${chave}`);
        const progress = document.getElementById(`progress_${chave}`);
        card.classList.remove('perda', 'ok', 'neutro');

        const pctMinimo = Math.min(100, Math.max(0, (finalReal / ins.estoqueMin) * 100));
        progress.style.width = pctMinimo + '%';
        progress.style.background = pctMinimo < 30 ? '#e74c3c' : pctMinimo < 70 ? '#f39c12' : '#27ae60';

        if (finalReal < ins.estoqueMin) {
            badge.textContent = '🔴 Abaixo';
            badge.style.background = '#fdecea'; badge.style.color = '#e74c3c';
            const necessidade = ins.estoqueMin - finalReal;
            const custoNecessidade = necessidade * custoUnit;
            sug.style.display = 'block';
            sug.textContent = `💡 Comprar ${necessidade.toFixed(2)} ${ins.unid} (≈ R$ ${custoNecessidade.toFixed(2)})`;
        } else {
            badge.textContent = '🟢 OK';
            badge.style.background = '#eafaf1'; badge.style.color = '#27ae60';
            sug.style.display = 'none';
        }

        if (divQtd > 0.001) {
            card.classList.add('perda');
            totais.perdaTotal += divR;
            if (divR > maiorPerdaR) { maiorPerdaR = divR; insumoCritico = ins.nome; }
        } else if (divQtd < -0.001) {
            card.classList.add('ok');
            totais.ganhoTotal += Math.abs(divR);
        } else card.classList.add('neutro');
    });

    document.getElementById('dashboardCard').style.display = 'block';
    document.getElementById('dashboardContent').innerHTML = `
        <p>🔴 <strong>Ponto Crítico:</strong> ${insumoCritico || 'Nenhum'} (Maior perda: R$ ${maiorPerdaR > -Infinity ? maiorPerdaR.toFixed(2) : '0,00'})</p>
        <p>📉 Perda total: R$ ${totais.perdaTotal.toFixed(2)} | 📈 Ganho total: R$ ${totais.ganhoTotal.toFixed(2)}</p>
    `;

    if (salvarHistorico) {
        historico.push({ data: new Date().toLocaleString(), consumo: { ...consumo }, totais: { ...totais }, insumoCritico });
        if (historico.length > 10) historico.shift();
        localStorage.setItem('cmvHistorico', JSON.stringify(historico));
    }
}

window.abrirDetalhes = function(chave) {
    const ins = insumos[chave];
    const consTeo = ultimoConsumo[chave] || 0;
    const finalReal = parseFloat(document.getElementById(`final_${chave}`)?.value) || 0;
    const divQtd = parseFloat(document.getElementById(`div_${chave}`)?.textContent) || 0;
    const divR = document.getElementById(`divR_${chave}`)?.textContent || '-';
    const hist = historico.filter(h => h.consumo && h.consumo[chave] !== undefined).slice(-5);
    document.getElementById('modalDetalhes').style.display = 'flex';
    document.getElementById('modalDetalhesConteudo').innerHTML = `
        <h3>📦 ${ins.nome} <small>(${ins.unid})</small></h3>
        <p><strong>Custo unitário:</strong> R$ ${ins.custoKg ? (ins.custoKg / 1000).toFixed(2) : ins.custoUnit.toFixed(2)}</p>
        <p><strong>Estoque mínimo:</strong> ${ins.estoqueMin} ${ins.unid}</p>
        <p><strong>Divergência atual:</strong> ${divQtd.toFixed(2)} ${ins.unid} (${divR})</p>
        <canvas id="grafico_${chave}" width="400" height="200" style="max-width:100%;height:auto;"></canvas>
        <h4>📜 Histórico recente</h4>
        ${hist.length ? hist.map(h => `<p style="font-size:0.8rem;">${h.data}: consumo ${h.consumo[chave]?.toFixed(2) || '0'}g</p>`).join('') : '<p style="font-size:0.8rem;">Sem histórico salvo.</p>'}
        <button class="btn" onclick="document.getElementById('modalDetalhes').style.display='none'" style="margin-top:12px;">Fechar</button>
    `;
    // Gráfico de barras comparativo
    setTimeout(() => {
        const canvas = document.getElementById('grafico_' + chave);
        if (canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#27ae60';
            const barraConsumo = Math.min(180, (consTeo / 500) * 180 || 2);
            ctx.fillRect(80, h - barraConsumo - 20, 80, barraConsumo);
            ctx.fillStyle = '#e74c3c';
            const barraFinal = Math.min(180, (finalReal / 500) * 180 || 2);
            ctx.fillRect(240, h - barraFinal - 20, 80, barraFinal);
            ctx.fillStyle = '#333';
            ctx.font = '12px Segoe UI';
            ctx.fillText('Consumo Teórico', 70, h - 5);
            ctx.fillText('Estoque Final', 235, h - 5);
            ctx.fillText(consTeo.toFixed(1) + ins.unid, 85, h - barraConsumo - 25);
            ctx.fillText(finalReal.toFixed(1) + ins.unid, 245, h - barraFinal - 25);
        }
    }, 200);
};

document.getElementById('btnAjuda').addEventListener('click', () => {
    document.getElementById('modalAjuda').style.display = 'flex';
    document.getElementById('modalAjudaConteudo').innerHTML = `
        <h2>📚 Central de Ajuda – CMV Legal</h2>
        <input class="search-input" id="searchAjuda" placeholder="🔍 Pesquisar dúvidas..." oninput="filtrarAjuda()">
        <div id="ajudaConteudo">
            <h3>🤔 O que é CMV?</h3>
            <p>CMV significa <strong>Custo da Mercadoria Vendida</strong>. É o valor total gasto com os insumos (ingredientes) para produzir todos os lanches, refrigerantes e sucos vendidos em um período. Controlar o CMV ajuda a lanchonete a entender para onde está indo o dinheiro dos ingredientes e a evitar desperdícios.</p>

            <h3>📦 O que é divergência de estoque?</h3>
            <p>Divergência é a diferença entre o <strong>estoque teórico</strong> (quanto deveria ter, segundo as vendas) e o <strong>estoque final real</strong> (quanto realmente sobrou). Se a divergência for positiva (estoque teórico > real), houve <strong>perda</strong> (desperdício, furto, erro). Se for negativa, houve <strong>ganho</strong> (sobra inesperada).</p>

            <h3>🧮 Como o aplicativo calcula?</h3>
            <p>1. Você informa as vendas de cada produto (lanches, refris, sucos).<br>2. O app multiplica cada venda pela <strong>ficha técnica</strong> (quantidade de cada insumo que vai no produto).<br>3. O consumo teórico total de cada insumo é somado.<br>4. Com o estoque inicial e as compras, calcula-se o <strong>estoque teórico</strong> = inicial + compras – consumo.<br>5. A divergência = estoque teórico – estoque final real.</p>

            <h3>✏️ Como preencher os campos?</h3>
            <p>- <strong>Vendas:</strong> digite quantas unidades de cada produto foram vendidas no período. Use números inteiros (ex: 20).<br>- <strong>Estoque Inicial:</strong> quanto havia do insumo no início do período (em gramas ou unidades).<br>- <strong>Compras:</strong> quanto foi comprado durante o período.<br>- <strong>Estoque Final Real:</strong> quanto sobrou no final, após contar fisicamente.<br>- Os campos têm <strong>placeholders</strong> (texto cinza) que somem ao digitar – não precisa apagar zero.</p>

            <h3>🔮 O que faz o simulador?</h3>
            <p>O controle deslizante "Simular aumento" permite aumentar virtualmente as vendas em uma porcentagem (ex: 10%). O consumo teórico é recalculado automaticamente, ajudando a prever necessidades de compra.</p>

            <h3>💾 O aplicativo salva meus dados?</h3>
            <p>Sim! O <strong>histórico</strong> dos últimos 10 cálculos fica salvo no navegador (localStorage). Ao clicar em um card de insumo, você vê o histórico de consumo daquele insumo e um gráfico comparativo.</p>

            <h3>📄 Como exportar?</h3>
            <p>Clique no botão <strong>"Exportar"</strong> (laranja) para baixar um arquivo de texto com o resumo das divergências de todos os insumos.</p>

            <h3>🌙 Modo escuro</h3>
            <p>Clique no ícone de lua 🌙 no canto superior direito para alternar entre tema claro e escuro.</p>

            <h3>🟢🔴 Cores dos cards</h3>
            <p>- <span style="color:#27ae60;">Verde pulsante</span>: insumo com ganho (divergência negativa).<br>- <span style="color:#e74c3c;">Vermelho pulsante</span>: insumo com perda (divergência positiva).<br>- A barra de progresso mostra o % do estoque mínimo: verde (ok), amarelo (atenção), vermelho (crítico).</p>

            <h3>📱 Dispositivos compatíveis</h3>
            <p>O CMV Legal funciona em celulares (vertical e horizontal), tablets, notebooks e desktops Windows. A tela se ajusta automaticamente a qualquer tamanho.</p>
        </div>
        <button class="btn" onclick="document.getElementById('modalAjuda').style.display='none'" style="margin-top:15px;">Voltar</button>
    `;
});

window.filtrarAjuda = function() {
    const termo = document.getElementById('searchAjuda')?.value.toLowerCase() || '';
    const conteudo = document.getElementById('ajudaConteudo');
    if (!conteudo) return;
    const blocos = conteudo.querySelectorAll('h3');
    blocos.forEach(h3 => {
        const p = h3.nextElementSibling;
        const texto = (h3.textContent + ' ' + (p?.textContent || '')).toLowerCase();
        if (texto.includes(termo)) {
            h3.style.display = 'block';
            if (p) p.style.display = 'block';
        } else {
            h3.style.display = 'none';
            if (p) p.style.display = 'none';
        }
    });
};

function tocarPalmas() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.08);
            }, i * 120);
        }
    } catch(e) {}
}

function tocarPlateia() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600 + Math.random() * 400, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            }, i * 80);
        }
    } catch(e) {}
}

function falar(texto) {
    return new Promise(resolve => {
        if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR'; utter.rate = 0.9;
            utter.onend = resolve;
            window.speechSynthesis.speak(utter);
        } else resolve();
    });
}
