<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CMV Legal | Heitor Serra Neto</title>
    <style>
        :root {
            --bg: #f0f4f7;
            --card-bg: #ffffff;
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --danger: #e74c3c;
            --danger-glow: rgba(231, 76, 60, 0.5);
            --success-glow: rgba(39, 174, 96, 0.5);
            --text: #1e2b38;
            --text-light: #5d6d7e;
            --header-bg: linear-gradient(135deg, #0f1a24, #1e2b38);
            --border-radius: 20px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .dark-mode {
            --bg: #1a1f24;
            --card-bg: #2a2f36;
            --text: #e0e0e0;
            --text-light: #a0a8b0;
            --header-bg: linear-gradient(135deg, #0a0f14, #141b22);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        .app { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }

        /* Header */
        .header {
            background: var(--header-bg);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        .logo-icon { font-size: 52px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .logo-title {
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(34px, 8vw, 52px); font-weight: 900; letter-spacing: 3px;
            color: white; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .logo-title .cmv { background: linear-gradient(to right, #ffffff, #e0e0e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-title .legal { background: linear-gradient(135deg, #27ae60, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: legalPulse 2s infinite; }
        @keyframes legalPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        .logo-subtitle { font-size: clamp(11px, 2.5vw, 15px); letter-spacing: 4px; color: rgba(255,255,255,0.85); text-transform: uppercase; }
        .logo-author { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; display: inline-block; }
        .dark-toggle {
            position: absolute; top: 15px; right: 20px; z-index: 2;
            background: rgba(255,255,255,0.15); border: none; color: white; font-size: 1.5rem;
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Main content */
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; width: 100%; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow); }
        h2 { font-size: 1.2rem; margin: 0 0 15px; color: var(--text); display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--primary); padding-left: 12px; }
        .abas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .aba-btn { background: #ecf0f1; border: none; padding: 8px 18px; border-radius: 25px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        .aba-btn.ativa { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(39,174,96,0.4); }
        .grid-vendas { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
        .input-group input { padding: 10px; border: 1px solid #dcdfe3; border-radius: 12px; font-size: 0.9rem; background: #f9fafb; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(39,174,96,0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

        /* Modal Danilo */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 999; display: flex;
            align-items: center; justify-content: center;
        }
        .modal-danilo {
            background: white; border-radius: 20px; padding: 30px;
            text-align: center; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-danilo h2 { border: none; justify-content: center; margin-bottom: 10px; }
        .modal-danilo button { margin-top: 15px; }

        /* Celebração */
        .celebracao-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; pointer-events: none;
        }
        .maos-palmas {
            font-size: 80px; animation: subirPalmas 1.5s ease-out forwards;
            display: flex; gap: 30px;
        }
        @keyframes subirPalmas {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .texto-parabens {
            color: gold; font-size: 3rem; font-weight: 900; margin-top: 20px;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            animation: brilho 0.8s infinite alternate;
        }
        @keyframes brilho { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Header -->
    <header class="header">
        <button class="dark-toggle" id="darkToggle" title="Alternar tema">🌙</button>
        <div class="logo-icon">🍔📊</div>
        <div class="logo-title"><span class="cmv">CMV</span> <span class="legal">Legal</span></div>
        <div class="logo-subtitle">Controle de Estoques e Gastos</div>
        <div class="logo-author">Desenvolvido por Heitor Serra Neto</div>
    </header>

    <!-- Conteúdo principal simplificado (cards de vendas e estoque serão gerados via JS) -->
    <div class="main-content" id="mainContent">
        <!-- Vendas -->
        <div class="card">
            <h2>📈 Vendas do Período</h2>
            <div class="abas" id="abas-vendas">
                <button class="aba-btn ativa" data-tab="lanches">Lanches</button>
                <button class="aba-btn" data-tab="refri">Refrigerantes</button>
                <button class="aba-btn" data-tab="sucos">Sucos Naturais</button>
            </div>
            <div id="vendas-lanches" class="grid-vendas tab-vendas"></div>
            <div id="vendas-refri" class="grid-vendas tab-vendas" style="display:none;"></div>
            <div id="vendas-sucos" class="grid-vendas tab-vendas" style="display:none;"></div>
        </div>

        <!-- Estoque -->
        <div class="card">
            <h2>📦 Estoque & Divergências</h2>
            <button class="btn-outline" id="exemplo-btn" style="margin-bottom:15px;">📋 Dados de exemplo</button>
            <div id="estoque-cards-container" class="estoque-cards" style="display:flex;flex-direction:column;gap:16px;"></div>
            <button class="btn" id="calcular-btn" style="margin-top:15px;">🔍 Calcular Divergências</button>
            <div id="resultado-resumo" style="margin-top:20px;padding:15px;background:var(--card-bg);border-radius:12px;box-shadow:var(--shadow);">Aguardando cálculo...</div>
        </div>
    </div>

    <!-- Botão flutuante calcular -->
    <button class="btn fab-calcular" id="fabCalcular" style="position:fixed;bottom:30px;right:30px;border-radius:60px;padding:16px 28px;z-index:10;">🔍 Calcular</button>

    <!-- Botão ajuda -->
    <button class="btn" id="btnAjuda" style="position:fixed;bottom:30px;left:30px;border-radius:50%;width:50px;height:50px;z-index:10;background:#3498db;">?</button>
</div>

<!-- Modal Danilo -->
<div class="modal-overlay" id="modalDanilo">
    <div class="modal-danilo">
        <h2>💡 Ideia do Danilo</h2>
        <p>Este aplicativo foi criado com a ideia do <strong>Danilo</strong>, amigo do Heitor.</p>
        <p style="font-size:0.9rem;color:#5d6d7e;">Teste o aplicativo e aproveite!</p>
        <button class="btn" id="btnOkDanilo">OK, vamos lá!</button>
    </div>
</div>

<script>
    // ========== DADOS ==========
    function normalizaInsumo(str) { return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase(); }

    const lanches = [
        { nome: 'X-Bacon', receita: { carne:150, bacon:50, queijo:30, pao:70 } },
        { nome: 'X-Salada', receita: { carne:120, queijo:20, alface:15, tomate:20, pao:70 } },
        { nome: 'X-Tudo', receita: { carne:150, bacon:40, ovo:1, presunto:30, queijo:30, alface:15, tomate:20, milho:20, batataPalha:20, pao:70 } },
        { nome: 'X-Egg', receita: { carne:150, ovo:1, queijo:30, pao:70 } },
        { nome: 'X-Frango', receita: { frango:150, queijo:30, alface:15, tomate:20, pao:70 } },
        { nome: 'X-Burger', receita: { carne:150, queijo:30, pao:70 } },
        { nome: 'X-Calabresa', receita: { carne:120, calabresa:50, queijo:30, pao:70 } },
        { nome: 'X-Coração', receita: { carne:120, coracao:60, queijo:30, pao:70 } },
        { nome: 'Misto Quente', receita: { presunto:50, queijo:50, pao:60 } },
        { nome: 'Veggie Burger', receita: { hamburguerGraoDeBico:130, alface:20, tomate:20, cebola:15, pao:70 } }
    ];

    const refris = ['Coca-Cola','Guaraná Antarctica','Sprite','Fanta Uva','Fanta Laranja','Pepsi','Soda Limonada','Água Tônica','Schweppes Citrus','H2OH']
        .map(nome => ({ nome, receita: { [normalizaInsumo(nome)]: 1 } }));

    const sucos = [
        { nome: 'Suco de Laranja', receita: { laranja:3, acucar:20 } },
        { nome: 'Limonada', receita: { limao:2, acucar:20 } },
        { nome: 'Suco de Abacaxi', receita: { abacaxi:150, acucar:15 } },
        { nome: 'Suco de Maracujá', receita: { maracuja:2, acucar:20 } },
        { nome: 'Suco de Acerola', receita: { acerola:100, acucar:20 } },
        { nome: 'Suco de Melancia', receita: { melancia:200, acucar:10 } },
        { nome: 'Suco de Morango', receita: { morango:120, acucar:20 } },
        { nome: 'Suco de Manga', receita: { manga:150, acucar:15 } },
        { nome: 'Suco de Goiaba', receita: { goiaba:100, acucar:20 } },
        { nome: 'Suco de Caju', receita: { caju:80, acucar:20 } }
    ];

    const insumos = {
        carne: { nome: 'Carne Bovina', unid: 'g', custoKg: 30, estoqueMin: 2000 },
        bacon: { nome: 'Bacon', unid: 'g', custoKg: 40, estoqueMin: 800 },
        queijo: { nome: 'Queijo', unid: 'g', custoKg: 35, estoqueMin: 1500 },
        pao: { nome: 'Pão de Hambúrguer', unid: 'g', custoKg: 12, estoqueMin: 2000 },
        ovo: { nome: 'Ovo', unid: 'un', custoUnit: 0.80, estoqueMin: 60 },
        presunto: { nome: 'Presunto', unid: 'g', custoKg: 28, estoqueMin: 500 },
        alface: { nome: 'Alface', unid: 'g', custoKg: 8, estoqueMin: 300 },
        tomate: { nome: 'Tomate', unid: 'g', custoKg: 10, estoqueMin: 400 },
        cebola: { nome: 'Cebola', unid: 'g', custoKg: 6, estoqueMin: 200 },
        milho: { nome: 'Milho', unid: 'g', custoKg: 7, estoqueMin: 200 },
        batataPalha: { nome: 'Batata Palha', unid: 'g', custoKg: 15, estoqueMin: 200 },
        calabresa: { nome: 'Calabresa', unid: 'g', custoKg: 22, estoqueMin: 300 },
        coracao: { nome: 'Coração de Frango', unid: 'g', custoKg: 18, estoqueMin: 300 },
        frango: { nome: 'Filé de Frango', unid: 'g', custoKg: 20, estoqueMin: 500 },
        hamburguerGraoDeBico: { nome: 'Hambúrguer Grão-de-Bico', unid: 'g', custoKg: 16, estoqueMin: 300 },
        laranja: { nome: 'Laranja', unid: 'un', custoUnit: 0.50, estoqueMin: 80 },
        limao: { nome: 'Limão', unid: 'un', custoUnit: 0.30, estoqueMin: 60 },
        abacaxi: { nome: 'Abacaxi', unid: 'g', custoKg: 7, estoqueMin: 2000 },
        maracuja: { nome: 'Maracujá', unid: 'un', custoUnit: 0.80, estoqueMin: 30 },
        acerola: { nome: 'Acerola', unid: 'g', custoKg: 12, estoqueMin: 500 },
        melancia: { nome: 'Melancia', unid: 'g', custoKg: 4, estoqueMin: 3000 },
        morango: { nome: 'Morango', unid: 'g', custoKg: 18, estoqueMin: 500 },
        manga: { nome: 'Manga', unid: 'g', custoKg: 8, estoqueMin: 1000 },
        goiaba: { nome: 'Goiaba', unid: 'g', custoKg: 6, estoqueMin: 500 },
        caju: { nome: 'Caju', unid: 'g', custoKg: 9, estoqueMin: 400 },
        acucar: { nome: 'Açúcar', unid: 'g', custoKg: 4, estoqueMin: 1000 }
    };
    refris.forEach(r => { const chave = normalizaInsumo(r.nome); insumos[chave] = { nome: r.nome + ' (lata)', unid: 'un', custoUnit: 2.50, estoqueMin: 40 }; });

    // ========== INTERFACE ==========
    function criarCamposVenda(container, lista) {
        container.innerHTML = lista.map(p => `<div class="input-group"><label>${p.nome}</label><input type="number" id="venda_${normalizaInsumo(p.nome)}" min="0" step="1" value="0"></div>`).join('');
    }
    criarCamposVenda(document.getElementById('vendas-lanches'), lanches);
    criarCamposVenda(document.getElementById('vendas-refri'), refris);
    criarCamposVenda(document.getElementById('vendas-sucos'), sucos);

    const containerCards = document.getElementById('estoque-cards-container');
    function montarCardsEstoque() {
        containerCards.innerHTML = Object.entries(insumos).map(([chave, ins]) => {
            const custo = ins.custoKg ? (ins.custoKg / 1000).toFixed(4) : ins.custoUnit.toFixed(2);
            return `<div class="insumo-card neutro" id="card_${chave}" style="background:var(--card-bg);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,0.05);border:2px solid transparent;transition:all 0.3s;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span style="font-weight:700;">📦 ${ins.nome} (${ins.unid})</span>
                    <span id="status_badge_${chave}" style="font-size:0.8rem;padding:4px 12px;border-radius:20px;">-</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:12px;">
                    <div class="input-group"><label>Estoque Inicial</label><input type="number" id="ini_${chave}" step="any" value="0"></div>
                    <div class="input-group"><label>Compras</label><input type="number" id="compra_${chave}" step="any" value="0"></div>
                    <div class="input-group"><label>Estoque Final Real</label><input type="number" id="final_${chave}" step="any" value="0"></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;background:#f8faf9;padding:12px;border-radius:12px;">
                    <div><span style="font-size:0.7rem;color:#5d6d7e;">Consumo Teórico</span><br><span id="cons_${chave}">-</span></div>
                    <div><span style="font-size:0.7rem;color:#5d6d7e;">Estoque Teórico</span><br><span id="teorico_${chave}">-</span></div>
                    <div><span style="font-size:0.7rem;color:#5d6d7e;">Divergência Qtd</span><br><span id="div_${chave}">-</span></div>
                    <div><span style="font-size:0.7rem;color:#5d6d7e;">Divergência R$</span><br><span id="divR_${chave}">-</span></div>
                    <div><span style="font-size:0.7rem;color:#5d6d7e;">Mínimo</span><br><span>${ins.estoqueMin}</span></div>
                </div>
                <div id="sugestao_${chave}" style="display:none;font-size:0.8rem;background:#fef9e7;padding:6px 10px;border-radius:8px;margin-top:8px;"></div>
            </div>`;
        }).join('');
    }
    montarCardsEstoque();

    // Exemplo
    document.getElementById('exemplo-btn').addEventListener('click', () => {
        const dados = { carne:{ini:5000,compra:2000,final:5800}, bacon:{ini:1500,compra:600,final:1300}, queijo:{ini:3000,compra:1000,final:2800}, pao:{ini:4000,compra:2000,final:3900}, ovo:{ini:100,compra:30,final:105}, presunto:{ini:1000,compra:300,final:950}, alface:{ini:500,compra:200,final:450}, tomate:{ini:600,compra:300,final:520}, cebola:{ini:300,compra:100,final:280}, milho:{ini:400,compra:0,final:350}, batataPalha:{ini:400,compra:0,final:330}, calabresa:{ini:600,compra:100,final:550}, coracao:{ini:500,compra:100,final:480}, frango:{ini:800,compra:300,final:750}, hamburguerGraoDeBico:{ini:500,compra:100,final:450}, laranja:{ini:120,compra:40,final:100}, limao:{ini:80,compra:20,final:65}, abacaxi:{ini:3000,compra:0,final:2500}, maracuja:{ini:50,compra:10,final:35}, acerola:{ini:700,compra:0,final:600}, melancia:{ini:5000,compra:0,final:4200}, morango:{ini:600,compra:100,final:520}, manga:{ini:1500,compra:200,final:1200}, goiaba:{ini:700,compra:0,final:580}, caju:{ini:500,compra:50,final:420}, acucar:{ini:2000,compra:500,final:1700} };
        Object.entries(dados).forEach(([k,v]) => {
            ['ini','compra','final'].forEach(t => { const el = document.getElementById(`${t}_${k}`); if(el) el.value = v[t]; });
        });
        ['xbacon','xtudo','xsalada','xegg','xburger','mistoquente'].forEach((id,i) => { const el = document.getElementById(`venda_${id}`); if(el) el.value = [20,10,15,8,25,12][i]; });
        alert('Dados de exemplo preenchidos!');
    });

    // Abas
    document.getElementById('abas-vendas').addEventListener('click', e => {
        if(e.target.classList.contains('aba-btn')) {
            document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativa'));
            e.target.classList.add('ativa');
            document.querySelectorAll('.tab-vendas').forEach(el => el.style.display = 'none');
            document.getElementById('vendas-' + e.target.dataset.tab).style.display = 'grid';
        }
    });

    // Cálculo
    function calcular() {
        const consumo = {}; Object.keys(insumos).forEach(k => consumo[k] = 0);
        [lanches, refris, sucos].forEach(lista => {
            lista.forEach(p => {
                const qtd = parseFloat(document.getElementById('venda_' + normalizaInsumo(p.nome))?.value) || 0;
                if(qtd>0) Object.entries(p.receita).forEach(([k,v]) => { if(consumo[k]!==undefined) consumo[k] += v*qtd; });
            });
        });
        let maiorPerdaR = -Infinity, insumoCritico = '';
        Object.entries(insumos).forEach(([chave, ins]) => {
            const ini = parseFloat(document.getElementById(`ini_${chave}`)?.value) || 0;
            const compra = parseFloat(document.getElementById(`compra_${chave}`)?.value) || 0;
            const finalReal = parseFloat(document.getElementById(`final_${chave}`)?.value) || 0;
            const consTeo = consumo[chave] || 0;
            const estoqueTeo = ini + compra - consTeo;
            const divQtd = estoqueTeo - finalReal;
            const custoUnit = ins.custoKg ? ins.custoKg/1000 : ins.custoUnit;
            const divR = divQtd * custoUnit;
            document.getElementById(`cons_${chave}`).textContent = consTeo.toFixed(2);
            document.getElementById(`teorico_${chave}`).textContent = estoqueTeo.toFixed(2);
            document.getElementById(`div_${chave}`).textContent = divQtd.toFixed(2);
            document.getElementById(`divR_${chave}`).textContent = 'R$ ' + divR.toFixed(2);
            const card = document.getElementById(`card_${chave}`);
            const badge = document.getElementById(`status_badge_${chave}`);
            const sug = document.getElementById(`sugestao_${chave}`);
            card.classList.remove('perda','ok','neutro');
            if(finalReal < ins.estoqueMin) {
                badge.className = 'status-baixo-badge'; badge.textContent = '🔴 Abaixo';
                sug.style.display = 'block'; sug.textContent = `💡 Comprar ${(ins.estoqueMin - finalReal).toFixed(2)} ${ins.unid}`;
            } else {
                badge.className = 'status-ok-badge'; badge.textContent = '🟢 OK';
                sug.style.display = 'none';
            }
            if(divQtd > 0.001) { card.classList.add('perda'); if(divR > maiorPerdaR) { maiorPerdaR = divR; insumoCritico = ins.nome; } }
            else if(divQtd < -0.001) card.classList.add('ok');
            else card.classList.add('neutro');
        });
        document.getElementById('resultado-resumo').innerHTML = `<strong>📊 Relatório:</strong> 🔴 Ponto Crítico: ${insumoCritico} (R$ ${maiorPerdaR.toFixed(2)})`;
    }
    document.getElementById('calcular-btn').addEventListener('click', calcular);
    document.getElementById('fabCalcular').addEventListener('click', calcular);

    // Dark mode
    document.getElementById('darkToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        document.getElementById('darkToggle').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });

    // ========== MODAL DANILO + CELEBRAÇÃO ==========
    const modal = document.getElementById('modalDanilo');
    document.getElementById('btnOkDanilo').addEventListener('click', () => {
        modal.style.display = 'none';
        // Som de palmas (Web Audio API - som sintetizado de "clap")
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            function clap() {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            }
            for(let i=0; i<6; i++) setTimeout(clap, i*150);
        } catch(e) { console.log('Áudio não suportado'); }

        // Animação de palmas
        const celebracao = document.createElement('div');
        celebracao.className = 'celebracao-overlay';
        celebracao.innerHTML = `
            <div class="maos-palmas">
                <span style="font-size:80px;">👏</span>
                <span style="font-size:80px;">👏</span>
            </div>
            <div class="texto-parabens">Parabéns, Danilo!</div>
        `;
        document.body.appendChild(celebracao);

        // Voz
        function falar(texto) {
            return new Promise(resolve => {
                if('speechSynthesis' in window) {
                    const utter = new SpeechSynthesisUtterance(texto);
                    utter.lang = 'pt-BR';
                    utter.rate = 0.9;
                    utter.onend = resolve;
                    window.speechSynthesis.speak(utter);
                } else resolve();
            });
        }
        async function discurso() {
            await falar('Parabéns, Danilo. Uhul!');
            for(let i=0; i<3; i++) await falar('Parabéns, Danilo. Você é o melhor.');
        }
        discurso().then(() => {
            setTimeout(() => {
                celebracao.remove();
            }, 1500);
        });
    });
</script>
</body>
</html>
