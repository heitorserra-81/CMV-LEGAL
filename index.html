<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CMV Legal | Heitor Serra Neto</title>
    <style>
        :root {
            --bg: #f0f4f7;
            --card-bg: #ffffff;
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --danger: #e74c3c;
            --danger-glow: rgba(231, 76, 60, 0.5);
            --success-glow: rgba(39, 174, 96, 0.5);
            --text: #1e2b38;
            --text-light: #5d6d7e;
            --header-bg: linear-gradient(135deg, #0f1a24, #1e2b38);
            --border-radius: 20px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        /* ========== HEADER & LOGO ========== */
        .header {
            background: var(--header-bg);
            padding: 20px 20px 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(39,174,96,0.15), transparent 60%);
            animation: headerGlow 6s infinite alternate;
            pointer-events: none;
        }

        @keyframes headerGlow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        .logo-container {
            position: relative;
            display: inline-block;
            z-index: 1;
        }

        .logo-icon {
            font-size: 52px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            margin-bottom: 6px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-title {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: clamp(34px, 8vw, 52px);
            font-weight: 900;
            letter-spacing: 3px;
            color: white;
            text-transform: uppercase;
            line-height: 1.1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .logo-title .cmv {
            background: linear-gradient(to right, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-title .legal {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: legalPulse 2s infinite;
        }

        @keyframes legalPulse {
            0%,100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .logo-subtitle {
            font-size: clamp(11px, 2.5vw, 15px);
            letter-spacing: 4px;
            color: rgba(255,255,255,0.85);
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 400;
        }

        .logo-author {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 10px;
            letter-spacing: 1.5px;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 10px;
            display: inline-block;
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            width: 100%;
            max-width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            transition: box-shadow 0.3s;
        }

        h2 {
            font-size: 1.2rem;
            margin: 0 0 15px;
            color: #1e2b38;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--primary);
            padding-left: 12px;
        }

        /* Abas */
        .abas {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .aba-btn {
            background: #ecf0f1;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .aba-btn.ativa {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(39,174,96,0.4);
        }

        .grid-vendas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }
        .input-group input {
            padding: 10px 12px;
            border: 1px solid #dcdfe3;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #f9fafb;
            transition: 0.2s;
            width: 100%;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(39,174,96,0.15);
            outline: none;
        }

        /* Estoque cards container */
        .estoque-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .insumo-card {
            background: white;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        /* Glow states */
        .insumo-card.perda {
            border-color: #e74c3c;
            animation: glowRed 1.8s infinite;
        }
        .insumo-card.ok {
            border-color: #27ae60;
            animation: glowGreen 2s infinite;
        }
        .insumo-card.neutro {
            border-color: #dfe6e9;
        }

        @keyframes glowRed {
            0% { box-shadow: 0 0 8px rgba(231,76,60,0.3), 0 6px 18px rgba(0,0,0,0.05); }
            50% { box-shadow: 0 0 20px rgba(231,76,60,0.6), 0 6px 18px rgba(0,0,0,0.1); }
            100% { box-shadow: 0 0 8px rgba(231,76,60,0.3), 0 6px 18px rgba(0,0,0,0.05); }
        }

        @keyframes glowGreen {
            0% { box-shadow: 0 0 6px rgba(39,174,96,0.2), 0 6px 18px rgba(0,0,0,0.05); }
            50% { box-shadow: 0 0 18px rgba(39,174,96,0.5), 0 6px 18px rgba(0,0,0,0.1); }
            100% { box-shadow: 0 0 6px rgba(39,174,96,0.2), 0 6px 18px rgba(0,0,0,0.05); }
        }

        .insumo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .insumo-nome {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .insumo-status {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .status-ok-badge {
            background: #eafaf1;
            color: #27ae60;
        }
        .status-baixo-badge {
            background: #fdecea;
            color: #e74c3c;
        }

        .insumo-dados {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }
        .insumo-dados .input-group input {
            background: #f4f6f8;
        }

        .insumo-resultados {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            background: #f8faf9;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .result-item {
            display: flex;
            flex-direction: column;
        }
        .result-label {
            font-size: 0.7rem;
            color: #5d6d7e;
            text-transform: uppercase;
        }
        .result-value {
            font-weight: 700;
        }
        .result-value.negativo {
            color: #e74c3c;
        }
        .result-value.positivo {
            color: #27ae60;
        }

        .sugestao-text {
            font-size: 0.8rem;
            font-style: italic;
            background: #fef9e7;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(39,174,96,0.3);
            margin-top: 10px;
        }
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .resultado-resumo {
            background: white;
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow);
            font-size: 0.95rem;
        }
        .ponto-critico {
            font-weight: 700;
            color: #e74c3c;
        }

        @media (max-width: 600px) {
            .insumo-dados, .insumo-resultados {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- ========== HEADER COM LOGO ========== -->
    <header class="header">
        <div class="logo-container">
            <div class="logo-icon">🍔📊</div>
            <div class="logo-title">
                <span class="cmv">CMV</span> <span class="legal">Legal</span>
            </div>
            <div class="logo-subtitle">Controle de Estoques e Gastos</div>
            <div class="logo-author">Desenvolvido por Heitor Serra Neto</div>
        </div>
    </header>

    <div class="main-content">
        <!-- Vendas -->
        <div class="card">
            <h2>📈 Vendas do Período</h2>
            <div class="abas" id="abas-vendas">
                <button class="aba-btn ativa" data-tab="lanches">Lanches</button>
                <button class="aba-btn" data-tab="refri">Refrigerantes</button>
                <button class="aba-btn" data-tab="sucos">Sucos Naturais</button>
            </div>
            <div id="vendas-lanches" class="grid-vendas tab-vendas"></div>
            <div id="vendas-refri" class="grid-vendas tab-vendas" style="display:none;"></div>
            <div id="vendas-sucos" class="grid-vendas tab-vendas" style="display:none;"></div>
        </div>

        <!-- Estoque (cards) -->
        <div class="card">
            <h2>📦 Estoque & Divergências</h2>
            <button class="btn-outline btn" id="exemplo-btn" style="margin-bottom:15px;">📋 Dados de exemplo</button>
            <div id="estoque-cards-container" class="estoque-cards">
                <!-- Cards gerados via JS -->
            </div>
            <button class="btn" id="calcular-btn">🔍 Calcular Divergências</button>
            <div id="resultado-resumo" class="resultado-resumo" style="margin-top:20px;">
                <strong>Aguardando cálculo...</strong>
            </div>
        </div>
    </div>
</div>

<script>
    // ======================= DADOS =======================
    function normalizaInsumo(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase();
    }

    const lanches = [
        { nome: 'X-Bacon', receita: { carne:150, bacon:50, queijo:30, pao:70 } },
        { nome: 'X-Salada', receita: { carne:120, queijo:20, alface:15, tomate:20, pao:70 } },
        { nome: 'X-Tudo', receita: { carne:150, bacon:40, ovo:1, presunto:30, queijo:30, alface:15, tomate:20, milho:20, batataPalha:20, pao:70 } },
        { nome: 'X-Egg', receita: { carne:150, ovo:1, queijo:30, pao:70 } },
        { nome: 'X-Frango', receita: { frango:150, queijo:30, alface:15, tomate:20, pao:70 } },
        { nome: 'X-Burger', receita: { carne:150, queijo:30, pao:70 } },
        { nome: 'X-Calabresa', receita: { carne:120, calabresa:50, queijo:30, pao:70 } },
        { nome: 'X-Coração', receita: { carne:120, coracao:60, queijo:30, pao:70 } },
        { nome: 'Misto Quente', receita: { presunto:50, queijo:50, pao:60 } },
        { nome: 'Veggie Burger', receita: { hamburguerGraoDeBico:130, alface:20, tomate:20, cebola:15, pao:70 } }
    ];

    const refris = [
        'Coca-Cola','Guaraná Antarctica','Sprite','Fanta Uva','Fanta Laranja',
        'Pepsi','Soda Limonada','Água Tônica','Schweppes Citrus','H2OH'
    ].map(nome => ({ nome, receita: { [normalizaInsumo(nome)]: 1 } }));

    const sucos = [
        { nome: 'Suco de Laranja', receita: { laranja:3, acucar:20 } },
        { nome: 'Limonada', receita: { limao:2, acucar:20 } },
        { nome: 'Suco de Abacaxi', receita: { abacaxi:150, acucar:15 } },
        { nome: 'Suco de Maracujá', receita: { maracuja:2, acucar:20 } },
        { nome: 'Suco de Acerola', receita: { acerola:100, acucar:20 } },
        { nome: 'Suco de Melancia', receita: { melancia:200, acucar:10 } },
        { nome: 'Suco de Morango', receita: { morango:120, acucar:20 } },
        { nome: 'Suco de Manga', receita: { manga:150, acucar:15 } },
        { nome: 'Suco de Goiaba', receita: { goiaba:100, acucar:20 } },
        { nome: 'Suco de Caju', receita: { caju:80, acucar:20 } }
    ];

    const insumos = {
        carne: { nome: 'Carne Bovina', unid: 'g', custoKg: 30, estoqueMin: 2000 },
        bacon: { nome: 'Bacon', unid: 'g', custoKg: 40, estoqueMin: 800 },
        queijo: { nome: 'Queijo', unid: 'g', custoKg: 35, estoqueMin: 1500 },
        pao: { nome: 'Pão de Hambúrguer', unid: 'g', custoKg: 12, estoqueMin: 2000 },
        ovo: { nome: 'Ovo', unid: 'un', custoUnit: 0.80, estoqueMin: 60 },
        presunto: { nome: 'Presunto', unid: 'g', custoKg: 28, estoqueMin: 500 },
        alface: { nome: 'Alface', unid: 'g', custoKg: 8, estoqueMin: 300 },
        tomate: { nome: 'Tomate', unid: 'g', custoKg: 10, estoqueMin: 400 },
        cebola: { nome: 'Cebola', unid: 'g', custoKg: 6, estoqueMin: 200 },
        milho: { nome: 'Milho', unid: 'g', custoKg: 7, estoqueMin: 200 },
        batataPalha: { nome: 'Batata Palha', unid: 'g', custoKg: 15, estoqueMin: 200 },
        calabresa: { nome: 'Calabresa', unid: 'g', custoKg: 22, estoqueMin: 300 },
        coracao: { nome: 'Coração de Frango', unid: 'g', custoKg: 18, estoqueMin: 300 },
        frango: { nome: 'Filé de Frango', unid: 'g', custoKg: 20, estoqueMin: 500 },
        hamburguerGraoDeBico: { nome: 'Hambúrguer Grão-de-Bico', unid: 'g', custoKg: 16, estoqueMin: 300 },
        laranja: { nome: 'Laranja', unid: 'un', custoUnit: 0.50, estoqueMin: 80 },
        limao: { nome: 'Limão', unid: 'un', custoUnit: 0.30, estoqueMin: 60 },
        abacaxi: { nome: 'Abacaxi', unid: 'g', custoKg: 7, estoqueMin: 2000 },
        maracuja: { nome: 'Maracujá', unid: 'un', custoUnit: 0.80, estoqueMin: 30 },
        acerola: { nome: 'Acerola', unid: 'g', custoKg: 12, estoqueMin: 500 },
        melancia: { nome: 'Melancia', unid: 'g', custoKg: 4, estoqueMin: 3000 },
        morango: { nome: 'Morango', unid: 'g', custoKg: 18, estoqueMin: 500 },
        manga: { nome: 'Manga', unid: 'g', custoKg: 8, estoqueMin: 1000 },
        goiaba: { nome: 'Goiaba', unid: 'g', custoKg: 6, estoqueMin: 500 },
        caju: { nome: 'Caju', unid: 'g', custoKg: 9, estoqueMin: 400 },
        acucar: { nome: 'Açúcar', unid: 'g', custoKg: 4, estoqueMin: 1000 }
    };

    refris.forEach(r => {
        const chave = normalizaInsumo(r.nome);
        insumos[chave] = {
            nome: r.nome + ' (lata)',
            unid: 'un',
            custoUnit: 2.50,
            estoqueMin: 40
        };
    });

    // ======================= MONTAGEM DA INTERFACE =======================
    function criarCamposVenda(container, lista) {
        container.innerHTML = lista.map(p =>
            `<div class="input-group">
                <label>${p.nome}</label>
                <input type="number" id="venda_${normalizaInsumo(p.nome)}" min="0" step="1" value="0">
            </div>`
        ).join('');
    }

    criarCamposVenda(document.getElementById('vendas-lanches'), lanches);
    criarCamposVenda(document.getElementById('vendas-refri'), refris);
    criarCamposVenda(document.getElementById('vendas-sucos'), sucos);

    // Cards de estoque
    const containerCards = document.getElementById('estoque-cards-container');
    function montarCardsEstoque() {
        containerCards.innerHTML = Object.entries(insumos).map(([chave, ins]) => {
            const custo = ins.custoKg ? (ins.custoKg / 1000).toFixed(4) : ins.custoUnit.toFixed(2);
            return `
            <div class="insumo-card neutro" id="card_${chave}">
                <div class="insumo-header">
                    <div class="insumo-nome">
                        <span>📦</span> ${ins.nome} <small style="color:#5d6d7e;">(${ins.unid})</small>
                    </div>
                    <div class="insumo-status" id="status_badge_${chave}">-</div>
                </div>
                <div class="insumo-dados">
                    <div class="input-group">
                        <label>Estoque Inicial</label>
                        <input type="number" id="ini_${chave}" step="any" value="0" placeholder="0">
                    </div>
                    <div class="input-group">
                        <label>Compras</label>
                        <input type="number" id="compra_${chave}" step="any" value="0" placeholder="0">
                    </div>
                    <div class="input-group">
                        <label>Estoque Final Real</label>
                        <input type="number" id="final_${chave}" step="any" value="0" placeholder="0">
                    </div>
                </div>
                <div class="insumo-resultados" id="resultados_${chave}">
                    <div class="result-item"><span class="result-label">Consumo Teórico</span><span class="result-value" id="cons_${chave}">-</span></div>
                    <div class="result-item"><span class="result-label">Estoque Teórico</span><span class="result-value" id="teorico_${chave}">-</span></div>
                    <div class="result-item"><span class="result-label">Divergência Qtd</span><span class="result-value" id="div_${chave}">-</span></div>
                    <div class="result-item"><span class="result-label">Divergência R$</span><span class="result-value" id="divR_${chave}">-</span></div>
                    <div class="result-item"><span class="result-label">Mínimo</span><span class="result-value">${ins.estoqueMin}</span></div>
                </div>
                <div class="sugestao-text" id="sugestao_${chave}" style="display:none;"></div>
            </div>`;
        }).join('');
    }
    montarCardsEstoque();

    // Exemplo
    document.getElementById('exemplo-btn').addEventListener('click', () => {
        const dadosExemplo = {
            carne: { ini: 5000, compra: 2000, final: 5800 },
            bacon: { ini: 1500, compra: 600, final: 1300 },
            queijo: { ini: 3000, compra: 1000, final: 2800 },
            pao: { ini: 4000, compra: 2000, final: 3900 },
            ovo: { ini: 100, compra: 30, final: 105 },
            presunto: { ini: 1000, compra: 300, final: 950 },
            alface: { ini: 500, compra: 200, final: 450 },
            tomate: { ini: 600, compra: 300, final: 520 },
            cebola: { ini: 300, compra: 100, final: 280 },
            milho: { ini: 400, compra: 0, final: 350 },
            batataPalha: { ini: 400, compra: 0, final: 330 },
            calabresa: { ini: 600, compra: 100, final: 550 },
            coracao: { ini: 500, compra: 100, final: 480 },
            frango: { ini: 800, compra: 300, final: 750 },
            hamburguerGraoDeBico: { ini: 500, compra: 100, final: 450 },
            laranja: { ini: 120, compra: 40, final: 100 },
            limao: { ini: 80, compra: 20, final: 65 },
            abacaxi: { ini: 3000, compra: 0, final: 2500 },
            maracuja: { ini: 50, compra: 10, final: 35 },
            acerola: { ini: 700, compra: 0, final: 600 },
            melancia: { ini: 5000, compra: 0, final: 4200 },
            morango: { ini: 600, compra: 100, final: 520 },
            manga: { ini: 1500, compra: 200, final: 1200 },
            goiaba: { ini: 700, compra: 0, final: 580 },
            caju: { ini: 500, compra: 50, final: 420 },
            acucar: { ini: 2000, compra: 500, final: 1700 }
        };
        Object.entries(dadosExemplo).forEach(([chave, vals]) => {
            const iniEl = document.getElementById(`ini_${chave}`);
            const compraEl = document.getElementById(`compra_${chave}`);
            const finalEl = document.getElementById(`final_${chave}`);
            if (iniEl) iniEl.value = vals.ini;
            if (compraEl) compraEl.value = vals.compra;
            if (finalEl) finalEl.value = vals.final;
        });
        document.getElementById('venda_xbacon').value = 20;
        document.getElementById('venda_xtudo').value = 10;
        document.getElementById('venda_xsalada').value = 15;
        document.getElementById('venda_xegg').value = 8;
        document.getElementById('venda_xburger').value = 25;
        document.getElementById('venda_mistoquente').value = 12;
        document.getElementById('venda_cocacola').value = 30;
        document.getElementById('venda_guaranaantarctica').value = 25;
        document.getElementById('venda_sucodelaranja').value = 18;
        document.getElementById('venda_limonada').value = 14;
        alert('Dados de exemplo preenchidos! Clique em "Calcular Divergências".');
    });

    // Abas
    document.getElementById('abas-vendas').addEventListener('click', (e) => {
        if (e.target.classList.contains('aba-btn')) {
            document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativa'));
            e.target.classList.add('ativa');
            const tab = e.target.dataset.tab;
            document.querySelectorAll('.tab-vendas').forEach(el => el.style.display = 'none');
            document.getElementById('vendas-' + tab).style.display = 'grid';
        }
    });

    // Cálculo
    document.getElementById('calcular-btn').addEventListener('click', () => {
        const consumo = {};
        Object.keys(insumos).forEach(k => consumo[k] = 0);

        function processarVendas(lista) {
            lista.forEach(prod => {
                const qtd = parseFloat(document.getElementById('venda_' + normalizaInsumo(prod.nome))?.value) || 0;
                if (qtd > 0) {
                    Object.entries(prod.receita).forEach(([insKey, qtdPorUnidade]) => {
                        if (consumo[insKey] !== undefined) consumo[insKey] += qtdPorUnidade * qtd;
                    });
                }
            });
        }

        processarVendas(lanches);
        processarVendas(refris);
        processarVendas(sucos);

        let maiorPerdaR = -Infinity;
        let insumoCritico = '';

        Object.entries(insumos).forEach(([chave, ins]) => {
            const ini = parseFloat(document.getElementById(`ini_${chave}`)?.value) || 0;
            const compra = parseFloat(document.getElementById(`compra_${chave}`)?.value) || 0;
            const finalReal = parseFloat(document.getElementById(`final_${chave}`)?.value) || 0;
            const consTeorico = consumo[chave] || 0;
            const estoqueTeorico = ini + compra - consTeorico;
            const divergenciaQtd = estoqueTeorico - finalReal;
            const custoUnitario = ins.custoKg ? ins.custoKg / 1000 : ins.custoUnit;
            const divergenciaR = divergenciaQtd * custoUnitario;

            document.getElementById(`cons_${chave}`).textContent = consTeorico.toFixed(2);
            document.getElementById(`teorico_${chave}`).textContent = estoqueTeorico.toFixed(2);
            document.getElementById(`div_${chave}`).textContent = divergenciaQtd.toFixed(2);
            document.getElementById(`divR_${chave}`).textContent = 'R$ ' + divergenciaR.toFixed(2);

            const card = document.getElementById(`card_${chave}`);
            const statusBadge = document.getElementById(`status_badge_${chave}`);
            const sugestaoEl = document.getElementById(`sugestao_${chave}`);

            // Status estoque mínimo
            if (finalReal < ins.estoqueMin) {
                statusBadge.className = 'insumo-status status-baixo-badge';
                statusBadge.textContent = '🔴 Abaixo do mínimo';
                sugestaoEl.style.display = 'block';
                sugestaoEl.textContent = `💡 Sugestão: Comprar ${(ins.estoqueMin - finalReal).toFixed(2)} ${ins.unid}`;
            } else {
                statusBadge.className = 'insumo-status status-ok-badge';
                statusBadge.textContent = '🟢 OK';
                sugestaoEl.style.display = 'none';
            }

            // Classes de glow
            card.classList.remove('perda', 'ok', 'neutro');
            if (divergenciaQtd > 0.001) {
                card.classList.add('perda');
                if (divergenciaR > maiorPerdaR) {
                    maiorPerdaR = divergenciaR;
                    insumoCritico = ins.nome;
                }
            } else if (divergenciaQtd < -0.001) {
                card.classList.add('ok');
            } else {
                card.classList.add('neutro');
            }
        });

        if (maiorPerdaR === -Infinity) maiorPerdaR = 0;
        document.getElementById('resultado-resumo').innerHTML = `
            <strong>📊 Relatório de Divergências</strong><br>
            🔴 <span class="ponto-critico">Ponto Crítico:</span> ${insumoCritico || 'Nenhum'} com perda de <strong>R$ ${maiorPerdaR.toFixed(2)}</strong>
            <div style="font-size:0.8rem; margin-top:6px;">✨ Cards com brilho vermelho indicam perdas, verde indicam ganhos.</div>
        `;
    });
</script>
</body>
</html>
